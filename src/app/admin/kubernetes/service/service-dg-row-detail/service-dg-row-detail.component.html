<div class="datagrid-row-flex datagrid-row-detail datagrid-container ng-star-inserted">
  <div class="datagrid-expandable-caret datagrid-fixed-column datagrid-cell ng-star-inserted"></div>
  <form>
    <section class="form-block endpoint-block">
      <label>Endpoint Info</label>
      <ng-container *ngIf="loaded; else loadingTpl">
        <ng-container *ngIf="hasAddresses; else emptyTpl">
          <div *ngFor="let subset of endpoint.subsets" class="endpoint-subset">
            <div *ngFor="let addr of subset.addresses" class="endpoint-row">
              <span class="endpoint-label">IP</span>
              <span class="endpoint-ip">{{ addr.ip }}</span>
              <span class="endpoint-label">Port</span>
              <span class="endpoint-ports" *ngIf="subset.ports?.length; else noPortTpl">
                <span class="port-chip" *ngFor="let port of subset.ports">
                  {{ port.name ? port.name + ':' : '' }}{{ port.port }}/{{ port.protocol }}
                </span>
              </span>
              <ng-template #noPortTpl><span class="endpoint-empty">-</span></ng-template>
            </div>
            <div *ngFor="let addr of subset.notReadyAddresses" class="endpoint-row not-ready">
              <span class="endpoint-label">IP</span>
              <span class="endpoint-ip">{{ addr.ip }}</span>
              <span class="endpoint-label">Port</span>
              <span class="endpoint-ports" *ngIf="subset.ports?.length; else noPortTpl">
                <span class="port-chip" *ngFor="let port of subset.ports">
                  {{ port.name ? port.name + ':' : '' }}{{ port.port }}/{{ port.protocol }}
                </span>
              </span>
              <ng-template #noPortTpl><span class="endpoint-empty">-</span></ng-template>
              <span class="not-ready-tag">未就绪</span>
            </div>
          </div>
        </ng-container>
        <ng-template #emptyTpl>
          <span class="endpoint-empty">暂无可用 Endpoint（没有就绪的 Pod，或无权限读取）</span>
        </ng-template>
      </ng-container>
      <ng-template #loadingTpl>
        <span class="endpoint-empty">加载中...</span>
      </ng-template>
    </section>
  </form>
</div>
